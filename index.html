<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Samurai at Dusk</title>
<meta name="description" content="A samurai walks through wind-blown susuki grass at sunset. Walking and jumping demo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #07060a;
    --ink: #f4e7cf;
    --ink-soft: rgba(244, 231, 207, 0.72);
    --ink-faint: rgba(244, 231, 207, 0.28);
    --ember: #ffb45e;
    --glass: rgba(20, 12, 10, 0.28);
    --font: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    cursor: grab;
    touch-action: none;
  }
  #game.looking { cursor: none; }

  /* Fade in from black while shaders compile. */
  #veil {
    position: fixed;
    inset: 0;
    background: var(--ground);
    display: grid;
    place-items: center;
    transition: opacity 1.6s ease;
    pointer-events: none;
    z-index: 5;
  }
  #veil span {
    font: 400 12px/1 var(--font);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  #veil.gone { opacity: 0; }

  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 22px;
    padding-inline: 16px;
    font: 400 12px/1.4 var(--font);
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
    pointer-events: none;
    transition: opacity 1.4s ease;
    z-index: 3;
  }
  #hint.gone { opacity: 0; }
  #hint kbd {
    font: 500 11px/1 var(--font);
    letter-spacing: 0.06em;
    color: var(--ink);
    padding: 3px 7px 4px;
    margin-right: 6px;
    border: 1px solid var(--ink-faint);
    border-radius: 4px;
    background: var(--glass);
  }

  /* Touch controls (shown only on touch devices). */
  .touch-only { display: none; }
  body.touch .touch-only { display: block; }
  body.touch .desk-only { display: none; }
  #stick {
    position: fixed;
    width: 116px;
    height: 116px;
    margin: -58px 0 0 -58px;
    border-radius: 50%;
    border: 1px solid var(--ink-faint);
    background: radial-gradient(circle, rgba(20, 12, 10, 0.05), rgba(20, 12, 10, 0.3));
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 4;
  }
  #stick.on { opacity: 1; }
  #stick i {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46px;
    height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    background: rgba(244, 231, 207, 0.22);
    border: 1px solid rgba(244, 231, 207, 0.45);
  }
  #jump {
    position: fixed;
    right: calc(28px + env(safe-area-inset-right, 0px));
    bottom: calc(34px + env(safe-area-inset-bottom, 0px));
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: 1px solid rgba(244, 231, 207, 0.5);
    background: rgba(20, 12, 10, 0.3);
    color: var(--ink);
    font: 500 13px/1 var(--font);
    letter-spacing: 0.14em;
    z-index: 4;
    touch-action: none;
  }
  #jump.down { background: rgba(255, 180, 94, 0.3); border-color: var(--ember); }
  body.touch #hint { bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }

  #fps {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top, 0px));
    left: 12px;
    font: 500 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: var(--ink-soft);
    z-index: 3;
  }
  #error {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding-inline: 24px;
    text-align: center;
    font: 400 15px/1.6 var(--font);
    color: var(--ink);
    background: var(--ground);
    z-index: 6;
  }
  @media (prefers-reduced-motion: reduce) {
    #veil, #hint { transition: none; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Samurai walking through a grass field at sunset"></canvas>
<div id="veil"><span>Loading</span></div>
<div id="hint" class="gone">
  <span class="desk-only"><kbd>W A S D</kbd>walk</span>
  <span class="desk-only"><kbd>Shift</kbd>run</span>
  <span class="desk-only"><kbd>Space</kbd>jump</span>
  <span class="desk-only"><kbd>Drag</kbd>look around</span>
  <span class="touch-only">Left thumb walks · right thumb looks · tap Jump</span>
</div>
<div id="stick" class="touch-only"><i></i></div>
<button id="jump" class="touch-only" type="button" aria-label="Jump">JUMP</button>
<div id="fps" hidden></div>
<div id="error" hidden></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
